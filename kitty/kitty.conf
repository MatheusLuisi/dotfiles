include colors/colors.conf

font_family      JetBrains Mono Nerd Font
font_size 10

disable_ligatures yes
enable_audio_bell no

url_style curly

cursor_shape block
cursor_trail 3

remember_window_size no
window_margin_width 21.75
window_padding_width 15
initial_window_width 78c
initial_window_height 23c
cursor_blink_interval 0

background_opacity 0.70
scrollbar_handle_opacity 0
scrollbar_track_opacity 0
scrollbar_track_hover_opacity 0

sync_to_monitor no
repaint_delay   8
input_delay     3


# Search
map ctrl+f   launch --location=hsplit --allow-remote-control kitty +kitten search.py @active-kitty-window-id
map kitty_mod+f   launch --location=hsplit --allow-remote-control kitty +kitten search.py @active-kitty-window-id

# No stupid close confirmation
confirm_os_window_close 0

# Use fish shell
shell fish

# Copy
map ctrl+c    copy_or_interrupt